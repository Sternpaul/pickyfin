# Pickyfin Server: build the Docker image and publish it to GitHub's registry
# (ghcr.io/sternpaul/pickyfin-server). Images, not GitHub releases, so the
# "latest release" stays the TV app and the Downloader link keeps working.
name: Pickyfin Server image

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-image.yaml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: server-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pickyfin-server" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Pickyfin Server: personal recommendation rows for Jellyfin
            org.opencontainers.image.licenses=GPL-2.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
